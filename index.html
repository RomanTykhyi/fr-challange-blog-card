<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="./assets/fonts/Figtree-Italic-VariableFont_wght.ttf">
  <link rel="preconnect" href="./assets/fonts/Figtree-VariableFont_wght.ttf">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="main-container">
    <div class="card">
      <picture>
        <img src="./assets/images/illustration-article.svg"></img>
      </picture>

      <section class="card-content">
        <label class="tag">Learning</label>
        <p class="publish-date">Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </section>
      
      <picture class="author">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper's avatar">
        <label>Greg Hooper</label>
      </picture>
    </div>
  </main>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
